// Normalize radicado - remove dashes, spaces, etc
function normalizeRadicado(radicado){
  return radicado.replace(/[-\s]/g, '');
}

// Extract info from despacho string
function parseDespacho(despachoStr){
  if(!despachoStr) return { municipio: '', especialidad: '', despacho: despachoStr };
  
  // Try to extract municipio from end (after last dash or in caps)
  const parts = despachoStr.split(' - ');
  let municipio = '';
  let especialidad = '';
  
  // Common patterns
  if(despachoStr.includes('BOGOTÁ')) municipio = 'BOGOTÁ';
  else if(despachoStr.includes('MEDELLÍN')) municipio = 'MEDELLÍN';
  else if(despachoStr.includes('CALI')) municipio = 'CALI';
  else if(despachoStr.includes('BARRANQUILLA')) municipio = 'BARRANQUILLA';
  else if(parts.length > 0) municipio = parts[parts.length - 1].replace('*','').trim();
  
  // Extract especialidad
  if(despachoStr.includes('FAMILIA')) especialidad = 'FAMILIA';
  else if(despachoStr.includes('CIVIL')) especialidad = 'CIVIL';
  else if(despachoStr.includes('PENAL')) especialidad = 'PENAL';
  else if(despachoStr.includes('LABORAL')) especialidad = 'LABORAL';
  else if(despachoStr.includes('ADMINISTRATIVO')) especialidad = 'ADMINISTRATIVO';
  
  return { municipio, especialidad, despacho: despachoStr };
}

// CORS Proxy helper - la API de Rama Judicial bloquea peticiones desde navegador
// Primero intenta usar el proxy local (proxy_server.py), luego proxies públicos
const USE_LOCAL_PROXY = true; // Cambiar a false si no usas proxy_server.py

const CORS_PROXIES = [
  '', // Intentar directo primero
  'https://corsproxy.io/?',
  'https://api.codetabs.com/v1/proxy?quest=',
  'https://thingproxy.freeboard.io/fetch/',
  'https://api.allorigins.win/raw?url='
];
let currentProxyIndex = 0;
let workingProxyIndex = -1;
let useLocalProxy = USE_LOCAL_PROXY;

// Convertir URL de Rama Judicial a URL del proxy local
function toLocalProxyUrl(url) {
  // https://consultaprocesos.ramajudicial.gov.co:448/api/v2/Procesos/...
  // -> /api/rama/Procesos/...
  const match = url.match(/ramajudicial\.gov\.co:448\/api\/v2\/(.+)/);
  if (match) {
    return '/api/rama/' + match[1];
  }
  return url;
}

async function fetchWithCorsProxy(url, retryCount = 0) {
  // Intentar primero con proxy local
  if (useLocalProxy && retryCount === 0) {
    try {
      const localUrl = toLocalProxyUrl(url);
      console.log('Intentando con proxy local:', localUrl);
      const response = await fetch(localUrl);
      if (response.ok) {
        console.log('✓ Proxy local funcionó');
        return response;
      }
    } catch (e) {
      console.log('Proxy local no disponible, usando proxies públicos...');
      useLocalProxy = false;
    }
  }
  
  // Si ya encontramos un proxy que funciona, usarlo directamente
  if (workingProxyIndex >= 0 && retryCount === 0) {
    currentProxyIndex = workingProxyIndex;
  }
  
  const proxy = CORS_PROXIES[currentProxyIndex];
  const proxyUrl = proxy ? proxy + encodeURIComponent(url) : url;
  
  console.log(`Intentando con: ${proxy || 'conexión directa'}`);
  
  try {
    const response = await fetch(proxyUrl);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    workingProxyIndex = currentProxyIndex;
    return response;
  } catch (error) {
    console.log(`Proxy falló: ${proxy || 'directo'} - ${error.message}`);
    if (retryCount < CORS_PROXIES.length - 1) {
      currentProxyIndex = (currentProxyIndex + 1) % CORS_PROXIES.length;
      return fetchWithCorsProxy(url, retryCount + 1);
    }
    throw error;
  }
}

// Consult Rama Judicial API
async function consultarRadicado(radicado){
  const normalized = normalizeRadicado(radicado);
  const url = `https://consultaprocesos.ramajudicial.gov.co:448/api/v2/Procesos/Consulta/NumeroRadicacion?numero=${normalized}&SoloActivos=false&pagina=1`;
  
  try {
    const response = await fetchWithCorsProxy(url);
    if(!response.ok) throw new Error('Error en la consulta');
    
    const data = await response.json();
    
    if(data.procesos && data.procesos.length > 0){
      const proceso = data.procesos[0];
      const parsed = parseDespacho(proceso.despacho);
      
      // Detectar si es proceso privado
      const esPrivado = proceso.esPrivado === true || 
                        (proceso.sujetosProcesales && proceso.sujetosProcesales.includes('PROCESO PRIVADO'));
      
      return {
        id: proceso.idProceso,
        radicado: proceso.llaveProceso,
        radicadoOriginal: radicado,
        municipio: parsed.municipio || proceso.departamento,
        especialidad: parsed.especialidad,
        despacho: parsed.despacho,
        fechaProceso: proceso.fechaProceso,
        fechaUltimaActuacion: proceso.fechaUltimaActuacion,
        sujetosProcesales: proceso.sujetosProcesales,
        esPrivado: esPrivado,
        status: esPrivado ? 'privado' : 'listo',
        raw: proceso
      };
    } else {
      return {
        id: 'err_' + Date.now() + '_' + Math.random(),
        radicado: radicado,
        radicadoOriginal: radicado,
        status: 'error',
        error: 'No encontrado'
      };
    }
  } catch(error) {
    return {
      id: 'err_' + Date.now() + '_' + Math.random(),
      radicado: radicado,
      radicadoOriginal: radicado,
      status: 'error',
      error: error.message
    };
  }
}

async function consultarRadicados(radicadosList){
  consultedProcesses = [];
  selectedProcessIds = new Set();
  currentReviewFilter = 'todos'; // Reset filtro al iniciar nueva consulta
  
  // Show loading
  document.getElementById('content').innerHTML = renderLoadingProcesos();
  
  // Consult each radicado
  for(const radicado of radicadosList){
    const result = await consultarRadicado(radicado);
    consultedProcesses.push(result);
    
    // Auto-select if listo (privados no se auto-seleccionan para que el usuario decida)
    if(result.status === 'listo'){
      selectedProcessIds.add(result.id);
    }
    // Los procesos privados no se auto-seleccionan - el usuario debe seleccionarlos manualmente
  }
  
  // Check for duplicates (already in procesos array)
  consultedProcesses.forEach(cp => {
    if(cp.status === 'listo'){
      const exists = procesos.find(p => p.radicado === cp.radicado);
      if(exists){
        cp.status = 'duplicado';
        selectedProcessIds.delete(cp.id);
      }
    }
  });
  
  // Show results
  currentView = 'revisarProcesos';
  render();
}

// Sync a single process with the API
async function syncProcess(proceso){
  if(!proceso.radicado) return proceso;
  
  // Initialize sync history if not exists
  if(!proceso.syncHistory) proceso.syncHistory = [];
  
  const syncStartTime = new Date().toISOString();
  
  try {
    const normalized = normalizeRadicado(proceso.radicado);
    const url = `https://consultaprocesos.ramajudicial.gov.co:448/api/v2/Procesos/Consulta/NumeroRadicacion?numero=${normalized}&SoloActivos=false&pagina=1`;
    
    const partesStart = Date.now();
    const response = await fetchWithCorsProxy(url);
    const partesDuration = ((Date.now() - partesStart) / 1000).toFixed(1) + ' s';
    
    if(!response.ok){
      // Record error in history
      proceso.syncHistory.unshift({
        inicio: syncStartTime,
        origen: 'Consulta Nacional Unific',
        operacion: 'Proceso',
        resultado: 'error',
        duracion: partesDuration,
        elementos: 0,
        error: 'Error HTTP ' + response.status
      });
      return proceso;
    }
    
    const data = await response.json();
    
    if(data.procesos && data.procesos.length > 0){
      const p = data.procesos[0];
      const parsed = parseDespacho(p.despacho);
      
      proceso.nombre = p.despacho || proceso.nombre;
      proceso.municipio = parsed.municipio || p.departamento;
      proceso.especialidad = parsed.especialidad;
      proceso.despacho = parsed.despacho;
      proceso.jurisdiccion = 'Ordinaria';
      proceso.fechaUltimaActuacion = p.fechaUltimaActuacion ? p.fechaUltimaActuacion.split('T')[0] : proceso.fechaUltimaActuacion;
      proceso.notas = p.sujetosProcesales || proceso.notas;
      proceso.lastSync = new Date().toISOString();
      proceso.synced = true;
      proceso.idProceso = p.idProceso;
      
      // Record partes sync
      proceso.syncHistory.unshift({
        inicio: syncStartTime,
        origen: 'Consulta Nacional Unific',
        operacion: 'Partes',
        resultado: 'exito',
        duracion: partesDuration,
        elementos: p.sujetosProcesales ? p.sujetosProcesales.split('|').length : 0,
        error: null
      });
      
      // Now fetch actuaciones
      try {
        const actStart = Date.now();
        const actUrl = `https://consultaprocesos.ramajudicial.gov.co:448/api/v2/Proceso/Actuaciones/${p.idProceso}?pagina=1`;
        const actResponse = await fetchWithCorsProxy(actUrl);
        const actDuration = ((Date.now() - actStart) / 1000).toFixed(1) + ' s';
        
        if(actResponse.ok){
          const actData = await actResponse.json();
          if(actData.actuaciones && actData.actuaciones.length > 0){
            const actuacionesOrdenadas = actData.actuaciones.sort((a, b) => {
              const fechaA = new Date(a.fechaActuacion || '1900-01-01');
              const fechaB = new Date(b.fechaActuacion || '1900-01-01');
              return fechaB - fechaA;
            });
            
            proceso.actuaciones = actuacionesOrdenadas.map(act => ({
              fecha: act.fechaActuacion ? act.fechaActuacion.split('T')[0] : '',
              actuacion: act.actuacion || '',
              anotacion: act.anotacion || '',
              fechaRegistro: act.fechaRegistro ? act.fechaRegistro.split('T')[0] : '',
              fechaInicial: act.fechaInicial ? act.fechaInicial.split('T')[0] : '',
              fechaFinal: act.fechaFinal ? act.fechaFinal.split('T')[0] : '',
              conDocumentos: act.conDocumentos || false,
              idRegActuacion: act.idRegActuacion || null,
              consActuacion: act.consActuacion || null
            }));
            
            const ultimaAct = actuacionesOrdenadas[0];
            proceso.ultimaActuacion = ultimaAct.actuacion || '';
            proceso.anotacion = ultimaAct.anotacion || '';
            proceso.fechaUltimaPublicacion = ultimaAct.fechaPublicacion ? ultimaAct.fechaPublicacion.split('T')[0] : '';
            if(ultimaAct.fechaActuacion){
              proceso.fechaUltimaActuacion = ultimaAct.fechaActuacion.split('T')[0];
            }
            
            // Record actuaciones sync
            proceso.syncHistory.unshift({
              inicio: syncStartTime,
              origen: 'Consulta Nacional Unific',
              operacion: 'Actuaciones',
              resultado: 'exito',
              duracion: actDuration,
              elementos: actData.actuaciones.length,
              error: null
            });
            
            console.log('Actuaciones cargadas:', proceso.actuaciones.length);
            
            // Cargar documentos de actuaciones que los tengan
            const actuacionesConDocs = proceso.actuaciones.filter(act => act.conDocumentos === true && act.idRegActuacion);
            if(actuacionesConDocs.length > 0){
              console.log('Cargando documentos de', actuacionesConDocs.length, 'actuaciones...');
              let todosDocumentos = [];
              
              for(const act of actuacionesConDocs){
                try {
                  const docUrl = `https://consultaprocesos.ramajudicial.gov.co:448/api/v2/Proceso/DocumentosActuacion/${act.idRegActuacion}`;
                  const docResponse = await fetchWithCorsProxy(docUrl);
                  
                  if(docResponse.ok){
                    const docs = await docResponse.json();
                    if(Array.isArray(docs) && docs.length > 0){
                      docs.forEach(doc => {
                        todosDocumentos.push({
                          ...doc,
                          fechaActuacion: act.fecha,
                          actuacion: act.actuacion
                        });
                      });
                    }
                  }
                } catch(docErr){
                  console.log('Error cargando documentos de actuación:', act.idRegActuacion, docErr);
                }
              }
              
              proceso.documentos = todosDocumentos;
              console.log('Documentos cargados:', todosDocumentos.length);
              
              // Record documentos sync
              proceso.syncHistory.unshift({
                inicio: new Date().toISOString(),
                origen: 'Consulta Nacional Unific',
                operacion: 'Documentos',
                resultado: 'exito',
                duracion: '—',
                elementos: todosDocumentos.length,
                error: null
              });
            }
          } else {
            proceso.syncHistory.unshift({
              inicio: syncStartTime,
              origen: 'Consulta Nacional Unific',
              operacion: 'Actuaciones',
              resultado: 'exito',
              duracion: actDuration,
              elementos: 0,
              error: null
            });
          }
        } else {
          proceso.syncHistory.unshift({
            inicio: syncStartTime,
            origen: 'Consulta Nacional Unific',
            operacion: 'Actuaciones',
            resultado: 'error',
            duracion: actDuration,
            elementos: 0,
            error: 'Error HTTP ' + actResponse.status
          });
        }
      } catch(actErr){
        console.log('Could not fetch actuaciones:', actErr);
        proceso.syncHistory.unshift({
          inicio: syncStartTime,
          origen: 'Consulta Nacional Unific',
          operacion: 'Actuaciones',
          resultado: 'error',
          duracion: '—',
          elementos: 0,
          error: actErr.message || 'Error de conexión'
        });
      }
      
      // Keep only last 50 sync history entries
      if(proceso.syncHistory.length > 50){
        proceso.syncHistory = proceso.syncHistory.slice(0, 50);
      }
    }
  } catch(e) {
    console.error('Error syncing process:', e);
    proceso.syncHistory.unshift({
      inicio: syncStartTime,
      origen: 'Consulta Nacional Unific',
      operacion: 'Proceso',
      resultado: 'error',
      duracion: '—',
      elementos: 0,
      error: e.message || 'Error de conexión'
    });
  }
  
  return proceso;
}

// Sync all processes
async function syncAllProcesses(){
  let updated = false;
  
  for(let i = 0; i < procesos.length; i++){
    const p = procesos[i];
    if(p.tipo === 'Judicial' && p.radicado){
      const fechaAgregadoOriginal = p.fechaAgregado; // Preserve fechaAgregado
      procesos[i] = await syncProcess(p);
      procesos[i].fechaAgregado = fechaAgregadoOriginal; // Restore fechaAgregado
      updated = true;
    }
  }
  
  if(updated){
    saveProcesos();
  }
  
  return updated;
}

  }
  
  // Apply specialty filter if set
  if(filterByEspecialidad){
    displayList = displayList.filter(p => (p.especialidad || 'Sin especialidad') === filterByEspecialidad);
  }
  
  // Get saved column width or default
  const savedWidths = JSON.parse(localStorage.getItem('columnWidths') || '{}');
  const getColWidth = (colName, defaultWidth) => savedWidths[colName] || defaultWidth;
  
  // Extract partes from notas - show full names
  // La API puede devolver: "Demandante:" o "Demandante/accionante:" 
  const getDemandante = (notas) => {
    if(!notas) return '—';
    // Buscar diferentes formatos posibles
    const patterns = [
      /Demandante\/accionante:\s*([^|]+)/i,
      /Demandante:\s*([^|]+)/i,
      /Accionante:\s*([^|]+)/i
    ];
    for(const pattern of patterns) {
      const match = notas.match(pattern);
      if(match) {
        // Limpiar el nombre (quitar saltos de línea, tabs, espacios extras)
        return match[1].replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();
      }
    }
    return '—';
  };
  
  const getDemandado = (notas) => {
    if(!notas) return '—';
    // Buscar diferentes formatos posibles
    const patterns = [
      /Demandado\/indiciado\/causante:\s*([^|]+)/i,
      /Demandado\/indiciado:\s*([^|]+)/i,
      /Demandado:\s*([^|]+)/i,
      /Indiciado:\s*([^|]+)/i,
      /Causante:\s*([^|]+)/i
    ];
    for(const pattern of patterns) {
      const match = notas.match(pattern);
      if(match) {

      }

    return '—';

  // Get entidad from despacho
  const getEntidad = (proceso) => {

  // Format sync cell with check and time

    if(!dateStr) return '—';
    const d = new Date(dateStr);
    if(isNaN(d)) return '—';
    
    const now = new Date();
    const diffMs = now - d;
    const diffMins = Math.floor(diffMs / 60000);
    
    const dateFormatted = d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}).replace('.', '') + ' ' + 
                          d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
    
    let timeAgo = '';
    if(diffMins < 1) timeAgo = 'ahora';
    else if(diffMins < 60) timeAgo = `hace ${diffMins} minutos`;
    else if(diffMins < 1440) timeAgo = `hace ${Math.floor(diffMins/60)} horas`;
    else timeAgo = `hace ${Math.floor(diffMins/1440)} días`;
    
    return '<div class="sync-cell"><span class="sync-status"><span class="sync-check">✓</span>' + dateFormatted + '</span><span class="sync-time">' + timeAgo + '</span></div>';
  };

  // Format publication date with "Hoy" badge (sin conversión de zona horaria)
  const formatPubDate = (dateStr) => {
    if(!dateStr) return '—';
    
    // Parsear fecha sin conversión de zona horaria
    const parts = dateStr.split('-');
    if(parts.length < 3) return '—';
    const year = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1;
    const day = parseInt(parts[2].split('T')[0]);
    
    const today = new Date();
    const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
    
    if(isToday) {
      return '<span class="badge-today">Hoy</span>';
    }
    
    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function renderProcesoDetalle(proceso){
  const getDemandante = (notas) => {
    if(!notas) return '—';
    const match = notas.match(/Demandante:\s*([^|]+)/);
    return match ? match[1].trim() : '—';
  };
  
  const getDemandado = (notas) => {
    if(!notas) return '—';
    const match = notas.match(/Demandado:\s*([^|]+)/);
    return match ? match[1].trim() : '—';
  };
  
  // Parse year from radicado (positions 13-16)
  const getYear = (radicado) => {
    if(!radicado || radicado.length < 17) return '—';
    return radicado.substring(12, 16);
  };
  
  // Format date without timezone issues
  const formatDate = (dateStr) => {
    if(!dateStr) return '—';
    const parts = dateStr.split('-');
    if(parts.length < 3) return dateStr;
    const year = parts[0];
    const month = parseInt(parts[1]) - 1;
    const day = parts[2].split('T')[0];
    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return `${day} ${meses[month]}, ${year}`;
  };
  
  const tabs = [
    { id: 'resumen', label: 'Resumen' },
    { id: 'actuaciones', label: 'Actuaciones' },

    { id: 'partes', label: 'Partes' },
    { id: 'relacionados', label: 'Relacionados' },
    { id: 'sincronizacion', label: 'Sincronización' }

  return `

function renderProcesoCalendarioTab(proceso){
  const actuaciones = proceso.actuaciones || [];
  const customEvents = proceso.customEvents || [];
  const year = processCalMonth.getFullYear();
  const month = processCalMonth.getMonth();
  
  const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const monthNamesShort = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  
  // Get first day of month and days in month
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  
  // Today
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  
  // Build calendar cells
  let cells = [];
  
  // Previous month days
  for(let i = startOffset; i > 0; i--){
    cells.push({ day: daysInPrevMonth - i + 1, muted: true, dateStr: null });
  }
  
  // Current month days
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayActuaciones = actuaciones.filter(act => act.fecha === dateStr);
    const dayCustomEvents = customEvents.filter(ev => ev.fecha === dateStr);
    const isWeekend = (cells.length % 7 === 0) || (cells.length % 7 === 6);
    cells.push({ 
      day: d, 
      muted: false, 
      dateStr,
      isToday: dateStr === todayStr,
      isWeekend,
      actuaciones: dayActuaciones,
      customEvents: dayCustomEvents
    });
  }
  
  // Next month days
  while(cells.length % 7 !== 0){
    cells.push({ day: cells.length - daysInMonth - startOffset + 1, muted: true, dateStr: null });
  }
  
  // Count events in month
  const actuacionesInMonth = actuaciones.filter(act => {
    if(!act.fecha) return false;
    const [actYear, actMonth] = act.fecha.split('-');
    return parseInt(actYear) === year && parseInt(actMonth) === month + 1;
  }).length;
  
  const customEventsInMonth = customEvents.filter(ev => {
    if(!ev.fecha) return false;
    const [evYear, evMonth] = ev.fecha.split('-');
    return parseInt(evYear) === year && parseInt(evMonth) === month + 1;
  }).length;
  
  const totalEventsInMonth = actuacionesInMonth + customEventsInMonth;
  
  // Format date range
  const rangeStart = `${monthNamesShort[month]} 1, ${year}`;
  const rangeEnd = `${monthNamesShort[month]} ${daysInMonth}, ${year}`;
  
  const dows = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  
  return `
    <div class="process-calendar">
      <div class="process-cal-header">
        <div class="process-cal-today">
          <div class="process-cal-today-month">${monthNamesShort[today.getMonth()]}</div>
          <div class="process-cal-today-day">${today.getDate()}</div>
        </div>
        <div>
          <span class="process-cal-title">${monthNames[month]} ${year}</span>
          <span class="process-cal-events">${totalEventsInMonth} eventos</span>
        </div>
        <div class="process-cal-nav">
          <button class="process-cal-nav-btn" id="processCalPrev">‹</button>
          <span class="process-cal-range">${rangeStart} - ${rangeEnd}</span>
          <button class="process-cal-nav-btn" id="processCalNext">›</button>
        </div>
        <div class="process-cal-views">
          <button class="process-cal-view-btn active">Mes</button>
          <button class="process-cal-view-btn">Agenda</button>
          <button class="process-cal-view-btn">Año</button>
        </div>

function renderPartesTab(proceso, getDemandante, getDemandado){
  // Parsear todos los sujetos procesales del campo notas
  const parseAllPartes = (notas) => {
    if(!notas) return [];
    // Separar por | y limpiar
    const partes = notas.split('|').map(p => p.trim()).filter(p => p);
    return partes.map(parte => {
      // Formato: "Tipo: Nombre"
      const match = parte.match(/^([^:]+):\s*(.+)$/);
      if(match) {
        return {
          tipo: match[1].replace(/[\r\n\t]+/g, ' ').trim(),
          nombre: match[2].replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim()
        };
      }
      return { tipo: 'Otro', nombre: parte };
    });
  };
  
  const partes = parseAllPartes(proceso.notas);
  const demandante = getDemandante(proceso.notas);
  const demandado = getDemandado(proceso.notas);
  
  // Si no hay partes parseadas, mostrar solo demandante/demandado
  if(partes.length === 0) {
    return `
      <div class="detail-section">
        <h3 class="detail-section-title">Partes del proceso</h3>
        <table style="width:100%;font-size:14px;">
          <tr>
            <td style="padding:12px 0;color:var(--text-muted);width:180px;vertical-align:top;">Demandante</td>
            <td style="padding:12px 0;font-weight:500;">${demandante}</td>
          </tr>
          <tr>
            <td style="padding:12px 0;color:var(--text-muted);vertical-align:top;">Demandado</td>
            <td style="padding:12px 0;font-weight:500;">${demandado}</td>
          </tr>
        </table>
        <p style="color:var(--text-muted);font-size:13px;margin-top:16px;">
          💡 Haz clic en "Sincronizar ahora" en la pestaña Sincronización para actualizar los datos.
        </p>
      </div>
    `;
  }
  
  return `
    <div class="detail-section">
      <h3 class="detail-section-title">Partes del proceso</h3>
      <table style="width:100%;font-size:14px;">
        ${partes.map(p => `
          <tr>
            <td style="padding:12px 0;color:var(--text-muted);width:180px;vertical-align:top;">${p.tipo}</td>
            <td style="padding:12px 0;font-weight:500;">${p.nombre}</td>
          </tr>
        `).join('')}
      </table>
    </div>
  `;
}

function renderNotasTab(proceso){
  const notasAbogado = proceso.notasAbogado || [];
  
  // Format date for display
  const formatNoteDate = (dateStr) => {
    const d = new Date(dateStr);
    const options = { 
      day: '2-digit', 
      month: 'short', 
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    };
    return d.toLocaleDateString('es-CO', options).replace(',', ' a las');
  };
  
  // Time ago
  const timeAgo = (dateStr) => {
    const d = new Date(dateStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMins / 60);
    const diffDays = Math.floor(diffMins / 1440);
    
    if(diffMins < 1) return 'hace un momento';
    if(diffMins < 60) return `hace ${diffMins} minuto${diffMins !== 1 ? 's' : ''}`;
    if(diffHours < 24) return `hace ${diffHours} hora${diffHours !== 1 ? 's' : ''}`;
    if(diffDays === 1) return 'ayer';
    if(diffDays < 7) return `hace ${diffDays} días`;
    return formatNoteDate(dateStr);
  };
  
  return `
    <div class="notes-container">
      <div class="notes-input-section">
        <textarea class="notes-textarea" id="newNoteText" placeholder="Escribe una nueva anotación sobre este proceso..."></textarea>
        <div class="notes-actions">
          <button class="toolbar-btn primary" id="btnAddNote">📝 Agregar anotación</button>
        </div>
      </div>
      
      ${notasAbogado.length > 0 ? `
        <div class="notes-count">${notasAbogado.length} anotación${notasAbogado.length !== 1 ? 'es' : ''}</div>
        <div class="notes-list">
          ${notasAbogado.slice().reverse().map(nota => `
            <div class="note-item" data-note-id="${nota.id}">
              <div class="note-header">
                <div class="note-date">
                  <span class="note-date-icon">📅</span>
                  <span>${formatNoteDate(nota.fecha)}</span>
                  <span style="color:#999;">• ${timeAgo(nota.fecha)}</span>
                </div>
                <div class="note-actions">
                  <button class="note-action-btn edit-note" data-note-id="${nota.id}">✏️ Editar</button>
                  <button class="note-action-btn delete delete-note" data-note-id="${nota.id}">🗑️ Eliminar</button>
                </div>
              </div>
              <div class="note-content">${nota.contenido}</div>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="notes-empty">
          <div class="notes-empty-icon">📝</div>
          <div class="notes-empty-text">No hay anotaciones aún.<br>Agrega tu primera anotación sobre este proceso.</div>
        </div>
      `}
    </div>
  `;
}

// Función para cargar documentos de las actuaciones
async function cargarDocumentosProceso(procesoId){
  const proceso = procesos.find(p => p.id === procesoId);
  if(!proceso) return;
  
  const actuacionesConDocs = (proceso.actuaciones || []).filter(act => act.conDocumentos === true && act.idRegActuacion);
  
  if(actuacionesConDocs.length === 0){
    alert('No hay actuaciones con documentos para cargar.');
    return;
  }
  
  // Mostrar loading
  const container = document.getElementById('documentosContainer');
  if(container){
    container.innerHTML = `
      <div style="text-align:center;padding:40px;">
        <div class="spinner"></div>
        <p style="margin-top:12px;color:var(--text-muted);">Cargando documentos...</p>
      </div>
    `;
  }
  
  // Array para guardar todos los documentos
  let todosDocumentos = [];
  
  for(const act of actuacionesConDocs){
    try {
      const url = `https://consultaprocesos.ramajudicial.gov.co:448/api/v2/Proceso/DocumentosActuacion/${act.idRegActuacion}`;
      const response = await fetchWithCorsProxy(url);
      
      if(response.ok){
        const docs = await response.json();
        if(Array.isArray(docs) && docs.length > 0){
          // Agregar info de la actuación a cada documento
          docs.forEach(doc => {
            todosDocumentos.push({
              ...doc,
              fechaActuacion: act.fecha,
              actuacion: act.actuacion
            });
          });
        }
      }
    } catch(e){
      console.log('Error cargando documentos de actuación:', act.idRegActuacion, e);
    }
  }
  
  // Guardar documentos en el proceso
  proceso.documentos = todosDocumentos;
  saveProcesos();
  
  // Re-renderizar
  render();
  
  if(todosDocumentos.length === 0){
    alert('No se encontraron documentos disponibles.');
  } else {
    console.log(`Se cargaron ${todosDocumentos.length} documento(s)`);
  }
}

function renderSincronizacionTab(proceso){
  // Format date for display
  const formatSyncDate = (dateStr) => {
    if(!dateStr) return '—';
    const d = new Date(dateStr);
    if(isNaN(d)) return '—';
    return d.toLocaleDateString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric'}) + ', ' + 
           d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  };
  
  // Format date for history table
  const formatHistoryDate = (dateStr) => {
    if(!dateStr) return '—';
    const d = new Date(dateStr);
    if(isNaN(d)) return '—';
    return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}).replace('.','') + ' ' + 
           d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  };
  
  // Get sync history or create default entries based on last sync
  const syncHistory = proceso.syncHistory || [];

        </tr>
      </table>
      <button class="toolbar-btn primary" id="btnSyncManual" style="margin-bottom:32px;">🔄 Sincronizar ahora</button>

// Variables para filtros de despachos
let despachoSearchTerm = '';
let despachoFilterType = 'mis'; // mis, todos
let selectedDespachoId = null; // Código del despacho seleccionado
let selectedDespachoTab = 'informacion'; // Pestaña activa: informacion, publicaciones, procesos, sync

function renderDespachos(){
  // Si hay un despacho seleccionado, mostrar su detalle
  if(selectedDespachoId){
    return renderDespachoDetail();
  }
  
  // Extraer despachos únicos de los procesos
  const despachosMap = new Map();
  
  procesos.forEach(p => {
    if(!p.despacho) return;
    
    const codigo = p.codigoDespacho || extractCodigoDespacho(p.radicado);
    
    // Usar el nombre del despacho como key principal para evitar mezclar juzgados diferentes
    // que pueden tener códigos similares en el radicado
    const key = p.despacho; // Agrupar por nombre, no por código
    
    if(!despachosMap.has(key)){
      despachosMap.set(key, {
        nombre: p.despacho,
        codigo: codigo,
        municipio: p.municipio || extractMunicipio(p.despacho),
        especialidad: p.especialidad || extractEspecialidad(p.despacho),
        tipo: extractTipoDespacho(p.despacho),
        procesos: [],
        fechaUltimaPublicacion: null,
        ultimaSync: null
      });
    }
    
    const despacho = despachosMap.get(key);
    despacho.procesos.push(p);
    
    // Actualizar código si el proceso tiene uno más específico
    if(p.codigoDespacho && (!despacho.codigo || despacho.codigo.length < p.codigoDespacho.length)){
      despacho.codigo = p.codigoDespacho;
    }
    
    // Actualizar fecha última publicación
    if(p.fechaUltimaActuacion){
      if(!despacho.fechaUltimaPublicacion || new Date(p.fechaUltimaActuacion) > new Date(despacho.fechaUltimaPublicacion)){
        despacho.fechaUltimaPublicacion = p.fechaUltimaActuacion;
      }
    }
    
    // Actualizar última sincronización
    if(p.lastSync){
      if(!despacho.ultimaSync || new Date(p.lastSync) > new Date(despacho.ultimaSync)){
        despacho.ultimaSync = p.lastSync;
      }
    }
  });
  
  let despachosList = Array.from(despachosMap.values());
  
  // Filtrar por búsqueda
  if(despachoSearchTerm){
    const term = despachoSearchTerm.toLowerCase();
    despachosList = despachosList.filter(d => 
      (d.nombre && d.nombre.toLowerCase().includes(term)) ||
      (d.codigo && d.codigo.includes(term)) ||
      (d.municipio && d.municipio.toLowerCase().includes(term))
    );
  }
  
  // Ordenar por nombre
  despachosList.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
  
  const despachosCount = despachosList.length;
  
  // Formatear tiempo relativo
  const timeAgo = (dateStr) => {
    if(!dateStr) return '—';
    const d = new Date(dateStr);
    const now = new Date();
    const diffMs = now - d;
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    
    if(diffDays === 0) return 'hoy';
    if(diffDays === 1) return 'hace 1 día';
    if(diffDays < 7) return `hace ${diffDays} días`;
    if(diffDays < 30) return `hace ${Math.floor(diffDays / 7)} semanas`;
    return `hace ${Math.floor(diffDays / 30)} meses`;
  };
  
  return `
    <div class="despachos-page">
      <!-- Header -->
      <div class="despachos-header">
        <div class="despachos-header-left">
          <div class="despachos-icon">🏛</div>
          <h1 class="despachos-title">Despachos</h1>
        </div>
      </div>

      <!-- Buscar Despacho por Radicado Section -->
      <div style="padding:20px 24px 0;">
        <div class="despacho-lookup-section">
          <h3 class="despacho-lookup-title">🔎 Buscar Despacho por Radicado</h3>
          <p class="despacho-lookup-sub">Ingresa un número de radicado para identificar automáticamente el despacho judicial y ver su información de contacto.</p>
          <div class="despacho-lookup-form">
            <input type="text" id="radicadoLookupInput" class="despacho-lookup-input" placeholder="Ej: 11001310300120230012300" maxlength="30">
            <button id="btnBuscarDespacho" class="despacho-lookup-btn">🔍 Buscar Despacho</button>
          </div>
          
          <!-- Resultado de búsqueda -->
          <div id="despachoResultContainer" class="despacho-result">
            <div class="despacho-result-card">
              <div class="despacho-result-header">
                <div class="despacho-result-header-left">
                  <h3 id="despachoResultNombre">—</h3>
                  <div class="codigo" id="despachoResultCodigo">—</div>
                </div>
                <span class="despacho-result-badge" id="despachoResultJurisdiccion">—</span>
              </div>
              <div class="despacho-result-body">
                <div class="despacho-result-grid">
                  <div class="despacho-result-item">
                    <span class="despacho-result-label">👨‍⚖️ Juez / Magistrado</span>
                    <span class="despacho-result-value" id="despachoResultJuez">—</span>
                  </div>
                  <div class="despacho-result-item">
                    <span class="despacho-result-label">📞 Teléfono</span>
                    <span class="despacho-result-value" id="despachoResultTelefono">—</span>
                  </div>
                  <div class="despacho-result-item full-width">
                    <span class="despacho-result-label">📍 Dirección</span>
                    <span class="despacho-result-value" id="despachoResultDireccion">—</span>
                  </div>
                  <div class="despacho-result-item">
                    <span class="despacho-result-label">🏙️ Municipio</span>
                    <span class="despacho-result-value" id="despachoResultMunicipio">—</span>
                  </div>
                  <div class="despacho-result-item">
                    <span class="despacho-result-label">🗺️ Departamento</span>
                    <span class="despacho-result-value" id="despachoResultDepartamento">—</span>
                  </div>
                  <div class="despacho-result-item">
                    <span class="despacho-result-label">⚖️ Distrito</span>
                    <span class="despacho-result-value" id="despachoResultDistrito">—</span>
                  </div>
                  <div class="despacho-result-item">
                    <span class="despacho-result-label">🔄 Circuito</span>
                    <span class="despacho-result-value" id="despachoResultCircuito">—</span>
                  </div>
                </div>
                <div class="despacho-result-actions">
                  <button class="despacho-result-btn" id="btnCopiarDespacho">📋 Copiar información</button>
                  <button class="despacho-result-btn" id="btnLimpiarBusqueda">✕ Limpiar</button>
                </div>
              </div>
            </div>
          </div>
          
          <!-- No encontrado -->
          <div id="despachoNotFoundContainer" class="despacho-not-found">
            <div class="despacho-not-found-title">⚠️ Despacho no encontrado</div>
            <p class="despacho-not-found-text">No se encontró un despacho con el código <strong id="codigoNoEncontrado"></strong>. 
            Esto puede ocurrir si el despacho no está en el directorio judicial cargado, o si el radicado no es válido.</p>
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="despachos-toolbar">
        <div class="despachos-toolbar-left">
          <button class="toolbar-btn" id="btnDespachosMenu">☰</button>
          <div class="despachos-search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="despachoSearchInput" placeholder="Buscar despacho por nombre..." value="${despachoSearchTerm}">
          </div>
          <span class="despachos-count">${despachosCount} despacho${despachosCount !== 1 ? 's' : ''}</span>
        </div>
        <div class="despachos-toolbar-right">
          <div class="despachos-filter-tabs">
            <button class="filter-tab ${despachoFilterType === 'mis' ? 'active' : ''}" data-despachofilter="mis">Mis despachos</button>
            <button class="filter-tab ${despachoFilterType === 'todos' ? 'active' : ''}" data-despachofilter="todos">Todos</button>
          </div>
          <button class="toolbar-btn">🔽 Filtros</button>
          <button class="toolbar-btn">↕ Ordenado por 1 campo</button>
          <button class="toolbar-btn">⊞ Columnas</button>
        </div>
      </div>

      <!-- Main Content -->
      <div class="despachos-content">
        <!-- Sidebar Vistas -->
        <div class="despachos-sidebar">
          <button class="vista-btn">+ Nueva vista</button>
          <div class="vista-search">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Buscar vistas" disabled>
          </div>
          <div class="vista-item active">
            <span class="vista-icon">📋</span>
            Vista predeterminada
          </div>
        </div>

        <!-- Table Area -->
        <div class="despachos-table-area">
          ${despachosList.length > 0 ? `
            <table class="despachos-table">
              <thead>
                <tr>
                  <th>Despacho</th>
                  <th>Código</th>
                  <th>Municipio</th>
                  <th>Especialidad</th>
                  <th>Tipo</th>
                  <th style="text-align:center;">Procesos</th>
                  <th>Fecha última publicación</th>
                  <th>Última sincronización</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${despachosList.map(d => `
                  <tr class="despacho-row" data-despacho-nombre="${encodeURIComponent(d.nombre || '')}" data-codigo="${d.codigo || ''}">

// Renderizar vista de detalle del despacho
function renderDespachoDetail(){
  // Buscar el despacho en los procesos
  let despachoData = null;
  let despachoDirectorio = null;
  
  // Primero buscar en los procesos cargados - usar nombre del despacho como key
  const despachosMap = new Map();
  procesos.forEach(p => {
    if(!p.despacho) return;
    const codigo = p.codigoDespacho || extractCodigoDespacho(p.radicado);
    const key = p.despacho; // Usar nombre como key
    
    if(!despachosMap.has(key)){
      despachosMap.set(key, {
        nombre: p.despacho,
        codigo: codigo,
        municipio: p.municipio || extractMunicipio(p.despacho),
        especialidad: p.especialidad || extractEspecialidad(p.despacho),
        tipo: extractTipoDespacho(p.despacho),
        procesos: [],
        fechaUltimaPublicacion: null,
        ultimaSync: null
      });
    }
    
    const despacho = despachosMap.get(key);
    despacho.procesos.push(p);
    
    // Actualizar código si hay uno más específico
    if(p.codigoDespacho && (!despacho.codigo || despacho.codigo.length < p.codigoDespacho.length)){
      despacho.codigo = p.codigoDespacho;
    }
    
    if(p.fechaUltimaActuacion){
      if(!despacho.fechaUltimaPublicacion || new Date(p.fechaUltimaActuacion) > new Date(despacho.fechaUltimaPublicacion)){
        despacho.fechaUltimaPublicacion = p.fechaUltimaActuacion;
      }
    }
    if(p.lastSync){
      if(!despacho.ultimaSync || new Date(p.lastSync) > new Date(despacho.ultimaSync)){
        despacho.ultimaSync = p.lastSync;
      }
    }
  });
  
  // Buscar el despacho seleccionado por nombre
  if(despachosMap.has(selectedDespachoId)){
    despachoData = despachosMap.get(selectedDespachoId);
  } else {
    // Fallback: buscar por código (compatibilidad)
    for(const [key, value] of despachosMap){
      if(value.codigo === selectedDespachoId){
        despachoData = value;
        break;
      }
    }
  }
  
  // Buscar información adicional en el directorio
  if(despachoData && despachoData.codigo && directorioDespachos.length > 0){
    const codigoBase = despachoData.codigo.replace(/[-\s]/g, '');
    
    // Usar la misma lógica que buscarDespachoPorCodigo
    // Código de 12 dígitos
    const codigo12 = codigoBase.substring(0, 12).padEnd(12, '0');
    despachoDirectorio = directorioDespachos.find(d => d.codigo === codigo12);
    
    // Si empieza con 0, buscar sin el cero inicial (11 dígitos)
    if(!despachoDirectorio && codigoBase.startsWith('0')){
      const sinCero = codigoBase.substring(1, 12);
      despachoDirectorio = directorioDespachos.find(d => d.codigo === sinCero);
    }
    
    // Intentar con el código tal cual (puede ser de 11 dígitos)
    if(!despachoDirectorio){
      despachoDirectorio = directorioDespachos.find(d => d.codigo === codigoBase);
    }
    
    // Si el código base tiene 11 dígitos y empieza con 0, quitar el cero
    if(!despachoDirectorio && codigoBase.length === 11 && codigoBase.startsWith('0')){
      const sinCero10 = codigoBase.substring(1);
      despachoDirectorio = directorioDespachos.find(d => d.codigo === sinCero10);
    }
    
    // Búsqueda con código + 0 al final (para códigos de 11 -> 12 dígitos)
    if(!despachoDirectorio && codigoBase.length === 11){
      despachoDirectorio = directorioDespachos.find(d => d.codigo === codigoBase + '0');
    }
    
    console.log('Búsqueda despacho:', codigoBase, '-> Encontrado:', despachoDirectorio ? despachoDirectorio.nombre : 'NO');
  }
  
  // Combinar información
  const nombre = despachoData?.nombre || despachoDirectorio?.nombre || 'Despacho';
  const codigo = despachoData?.codigo || despachoDirectorio?.codigo || selectedDespachoId;
  const municipio = despachoDirectorio?.municipio || despachoData?.municipio || '—';
  const especialidad = despachoData?.especialidad || '—';
  const tipo = despachoDirectorio?.tipo || despachoData?.tipo || '—';
  const juez = despachoDirectorio?.juez || '—';
  const telefono = despachoDirectorio?.telefono || '—';
  const direccion = despachoDirectorio?.direccion || '—';
  const departamento = despachoDirectorio?.departamento || '—';
  const distrito = despachoDirectorio?.distrito || '—';
  const circuito = despachoDirectorio?.circuito || '—';
  const jurisdiccion = despachoDirectorio?.jurisdiccion || '—';
  const area = despachoDirectorio?.area || '—';
  const procesosDespacho = despachoData?.procesos || [];
  
  // Renderizar contenido según la pestaña activa
  let tabContent = '';
  
  if(selectedDespachoTab === 'informacion'){
    tabContent = `
      <div class="despacho-detail-info">
        <div class="despacho-info-grid">
          <div class="despacho-info-card">
            <div class="despacho-info-icon">👨‍⚖️</div>
            <div class="despacho-info-content">
              <div class="despacho-info-label">Juez / Magistrado</div>
              <div class="despacho-info-value">${juez}</div>
            </div>
          </div>
          <div class="despacho-info-card">
            <div class="despacho-info-icon">📞</div>
            <div class="despacho-info-content">
              <div class="despacho-info-label">Teléfono</div>
              <div class="despacho-info-value">${telefono}</div>
            </div>
          </div>
          <div class="despacho-info-card full-width">
            <div class="despacho-info-icon">📍</div>
            <div class="despacho-info-content">
              <div class="despacho-info-label">Dirección</div>
              <div class="despacho-info-value">${direccion}</div>
            </div>
          </div>
          <div class="despacho-info-card">
            <div class="despacho-info-icon">🏙️</div>
            <div class="despacho-info-content">
              <div class="despacho-info-label">Municipio</div>
              <div class="despacho-info-value">${municipio}</div>
            </div>
          </div>
          <div class="despacho-info-card">
            <div class="despacho-info-icon">🗺️</div>
            <div class="despacho-info-content">
              <div class="despacho-info-label">Departamento</div>
              <div class="despacho-info-value">${departamento}</div>
            </div>
          </div>
          <div class="despacho-info-card">
            <div class="despacho-info-icon">⚖️</div>
            <div class="despacho-info-content">
              <div class="despacho-info-label">Distrito Judicial</div>
              <div class="despacho-info-value">${distrito}</div>
            </div>
          </div>
          <div class="despacho-info-card">
            <div class="despacho-info-icon">🔄</div>
            <div class="despacho-info-content">

// Extraer código del despacho del radicado (primeros 12 dígitos son el código del despacho)
// Estructura: DANE(5) + Corporación(2) + Especialidad(2) + Consecutivo(3) = 12 dígitos
function extractCodigoDespacho(radicado){
  if(!radicado) return '';
  const clean = radicado.replace(/[-\s]/g, '');
  if(clean.length >= 12){
    return clean.substring(0, 12);
  }
  return clean; // Retornar lo que haya si tiene menos de 12
}

// Extraer municipio del nombre del despacho
function extractMunicipio(despacho){
  if(!despacho) return '';
  const municipios = ['BOGOTÁ', 'MEDELLÍN', 'CALI', 'BARRANQUILLA', 'CARTAGENA', 'BUCARAMANGA', 'PEREIRA', 'MANIZALES', 'SANTA MARTA', 'CÚCUTA', 'IBAGUÉ', 'VILLAVICENCIO', 'PASTO', 'NEIVA', 'ARMENIA', 'MONTERÍA'];
  const upper = despacho.toUpperCase();
  for(const m of municipios){
    if(upper.includes(m)) return m;
  }
  // Intentar extraer del final después de " DE " o " - "
  const parts = despacho.split(/\s+DE\s+|\s+-\s+/i);
  if(parts.length > 1){
    return parts[parts.length - 1].trim().toUpperCase();
  }
  return '';
}

// Extraer especialidad del nombre del despacho
function extractEspecialidad(despacho){
  if(!despacho) return '';
  const upper = despacho.toUpperCase();
  if(upper.includes('FAMILIA')) return 'FAMILIA';
  if(upper.includes('CIVIL')) return 'CIVIL';
  if(upper.includes('PENAL')) return 'PENAL';
  if(upper.includes('LABORAL')) return 'LABORAL';
  if(upper.includes('ADMINISTRATIVO')) return 'ADMINISTRATIVO';
  if(upper.includes('PROMISCUO')) return 'PROMISCUO';
  return '';
}

// Extraer tipo de despacho
function extractTipoDespacho(despacho){
  if(!despacho) return '';
  const upper = despacho.toUpperCase();
  if(upper.includes('CIRCUITO')) return 'Juzgado del Circuito';
  if(upper.includes('MUNICIPAL')) return 'Juzgado Municipal';
  if(upper.includes('TRIBUNAL')) return 'Tribunal';
  if(upper.includes('CORTE')) return 'Corte';
  if(upper.includes('DESPACHO')) return 'Despacho';
  return 'Juzgado';
}

function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function getDayEvents(dateStr){
  const items = [];
  // Usar todos los procesos (incluyendo archivados) para el calendario
  const allProcesos = JSON.parse(localStorage.getItem('procesos') || '[]');
  
  allProcesos.forEach(p=>{
    if(p.fechaInicio === dateStr) items.push({type:'inicio', label:'Inicio: '+p.nombre, proceso:p});
    
    // Check all actuaciones for this process - usar act.fecha (fechaActuacion) para coincidir con Rama Judicial
    if(p.actuaciones && p.actuaciones.length > 0){
      p.actuaciones.forEach(act => {
        // act.fecha contiene fechaActuacion del API (la fecha que muestra Rama Judicial)
        // Comparar solo la parte de fecha (YYYY-MM-DD)
        const actFecha = (act.fecha || '').substring(0, 10);
        if(actFecha === dateStr){
          items.push({
            type:'actuacion', 
            label: p.radicado || p.nombre,
            actuacion: act.actuacion || '',
            anotacion: act.anotacion || '',
            fecha: actFecha,
            proceso: p
          });
        }
      });
    }
  });
  
  // Eventos manuales antiguos
  eventos.filter(e=>e.fecha===dateStr).forEach(e=> items.push({type:'manual', label:e.titulo, evento:e}));
  
  // Eventos personalizados del calendario
  const customEvents = JSON.parse(localStorage.getItem('calendarEvents') || '[]');
  customEvents.filter(e => e.fecha === dateStr).forEach(e => items.push({type:'custom', evento:e}));
  
  return items;
}

  // Función para construir la URL de publicaciones (para abrir en portal externo)
  function buildPublicacionesUrl(codigoDespacho, fechaInicio, fechaFin){
    const codigoDANE = codigoDespacho.substring(0, 5);
    const idDepto = codigoDANE.substring(0, 2);
    const idMuni = codigoDANE;
    const idDeptoCategory = deptoCategories[idDepto] || '';
    
    const portletId = 'co_com_avanti_efectosProcesales_PublicacionesEfectosProcesalesPortletV2_INSTANCE_BIyXQFHVaYaq';
    const baseUrl = 'https://publicacionesprocesales.ramajudicial.gov.co/web/publicaciones-procesales/inicio';
    
    const params = new URLSearchParams();
    params.set('p_p_id', portletId);
    params.set('p_p_lifecycle', '0');
    params.set('p_p_state', 'normal');
    params.set('p_p_mode', 'view');
    params.set(`_${portletId}_action`, 'busqueda');
    params.set(`_${portletId}_fechaInicio`, fechaInicio);
    params.set(`_${portletId}_fechaFin`, fechaFin);
    params.set(`_${portletId}_idDepto`, idDepto);
    params.set(`_${portletId}_idMuni`, idMuni);
    params.set(`_${portletId}_idDespacho`, codigoDespacho);
    params.set(`_${portletId}_verTotales`, 'true');
    if(idDeptoCategory) params.set(`_${portletId}_idDeptoIdCategory`, idDeptoCategory);
    
    return `${baseUrl}?${params.toString()}`;
  }
  
  // Función para construir URL del proxy local
  function buildProxyUrl(codigoDespacho, fechaInicio, fechaFin){
    const codigoDANE = codigoDespacho.substring(0, 5);
    const idDepto = codigoDANE.substring(0, 2);
    const idMuni = codigoDANE;
    const idDeptoCategory = deptoCategories[idDepto] || '';
    
    const params = new URLSearchParams();
    params.set('fechaInicio', fechaInicio);
    params.set('fechaFin', fechaFin);
    params.set('idDepto', idDepto);
    params.set('idMuni', idMuni);
    params.set('idDespacho', codigoDespacho);
    params.set('idDeptoIdCategory', idDeptoCategory);
    
    // Usar proxy local
    return `/api/publicaciones?${params.toString()}`;
  }

  // Función para parsear fecha en español
  function parsearFechaEspanol(fechaStr){
    if(!fechaStr) return null;
    
    const meses = {
      'enero': 0, 'febrero': 1, 'marzo': 2, 'abril': 3, 'mayo': 4, 'junio': 5,
      'julio': 6, 'agosto': 7, 'septiembre': 8, 'octubre': 9, 'noviembre': 10, 'diciembre': 11
    };
    
    // Formato: "8 de agosto de 2026" o "25 de Agosto de 2026"
    const matchTexto = fechaStr.match(/(\d+)\s+de\s+(\w+)\s+de\s+(\d{4})/i);
    if(matchTexto){
      const dia = parseInt(matchTexto[1]);
      const mes = meses[matchTexto[2].toLowerCase()];
      const año = parseInt(matchTexto[3]);
      if(mes !== undefined){
        return new Date(año, mes, dia);
      }
    }
    
    // Formato ISO: "2026-08-25"
    const matchISO = fechaStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(matchISO){
      return new Date(parseInt(matchISO[1]), parseInt(matchISO[2])-1, parseInt(matchISO[3]));
    }
    
    // Formato: "25/08/2026"
    const matchBarra = fechaStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(matchBarra){
      return new Date(parseInt(matchBarra[3]), parseInt(matchBarra[2])-1, parseInt(matchBarra[1]));
    }
    
    return null;
  }
  
  // Función para verificar si una fecha está en el rango
  function fechaEnRango(fechaStr, fechaInicio, fechaFin){
    if(!fechaStr || !fechaInicio || !fechaFin) return true; // Si no hay fecha, incluir
    
    const fecha = parsearFechaEspanol(fechaStr);
    if(!fecha || isNaN(fecha.getTime())) return true; // Si no se puede parsear, incluir
    
    const inicio = new Date(fechaInicio);
    const fin = new Date(fechaFin);
    fin.setHours(23, 59, 59);
    
    return fecha >= inicio && fecha <= fin;
  }

  // Función para renderizar publicaciones y documentos en la tabla
  function renderPublicacionesTable(publicaciones, documentos, fechaInicio, fechaFin){
    const tbody = document.getElementById('publicacionesTableBody');
    const countEl = document.getElementById('publicacionesCount');
    
    if(!tbody) return;
    
    // Filtrar documentos por fecha
    let documentosFiltrados = (documentos || []).filter(doc => {
      // Intentar extraer fecha del nombre si no tiene fecha
      let fecha = doc.fecha;
      if(!fecha && doc.nombre){
        // Buscar fecha en el nombre: "Estado-128 28 AGOST 2026.pdf"
        const matchNombre = doc.nombre.match(/(\d{1,2})\s*(?:AGOST?|SEPT?|OCT|NOV|DIC|ENE|FEB|MAR|ABR|MAY|JUN|JUL)\w*\s*(\d{4})/i);
        if(matchNombre){
          const mesesCortos = {
            'ene': 'enero', 'feb': 'febrero', 'mar': 'marzo', 'abr': 'abril', 
            'may': 'mayo', 'jun': 'junio', 'jul': 'julio', 'ago': 'agosto', 
            'agost': 'agosto', 'sep': 'septiembre', 'sept': 'septiembre',
            'oct': 'octubre', 'nov': 'noviembre', 'dic': 'diciembre'
          };
          const mesMatch = doc.nombre.match(/(AGOST?|SEPT?|OCT|NOV|DIC|ENE|FEB|MAR|ABR|MAY|JUN|JUL)/i);
          if(mesMatch){
            const mesCorto = mesMatch[1].toLowerCase().substring(0, 3);
            const mesCompleto = mesesCortos[mesCorto] || mesesCortos[mesMatch[1].toLowerCase()];
            if(mesCompleto){
              fecha = `${matchNombre[1]} de ${mesCompleto} de ${matchNombre[2]}`;
            }
          }
        }
      }
      return fechaEnRango(fecha, fechaInicio, fechaFin);
    });
    
    // Filtrar publicaciones por fecha
    let publicacionesFiltradas = (publicaciones || []).filter(pub => {
      return fechaEnRango(pub.fecha, fechaInicio, fechaFin);
    });
    
    console.log(`[Publicaciones] Filtrado: ${documentos?.length || 0} → ${documentosFiltrados.length} docs, ${publicaciones?.length || 0} → ${publicacionesFiltradas.length} pubs (rango: ${fechaInicio} a ${fechaFin})`);
    
    // Combinar publicaciones y documentos para mostrar
    const totalItems = publicacionesFiltradas.length + documentosFiltrados.length;
    
    if(countEl) countEl.textContent = `${totalItems} resultado${totalItems !== 1 ? 's' : ''} (${documentosFiltrados.length} documentos)`;
    
    if(totalItems === 0){
      showPublicacionesState('empty');
      return;
    }
    
    let html = '';
    
    // Primero mostrar documentos PDF (que es lo que el usuario quiere)
    if(documentosFiltrados.length > 0){
      html += documentosFiltrados.map(doc => `
        <tr class="doc-row">
          <td class="pub-titulo">
            <span class="doc-icon">📄</span>
            ${doc.nombre || 'Documento'}
          </td>
          <td class="pub-fecha">${doc.fecha || '—'}</td>
          <td><span class="pub-tipo pdf">PDF</span></td>
          <td>
            <button class="btn-descargar-pdf" data-url="${encodeURIComponent(doc.url)}" data-nombre="${doc.nombre || 'documento.pdf'}">
              ⬇️ Descargar
            </button>
          </td>
        </tr>
      `).join('');
    }
    
    // Luego mostrar publicaciones (resumen)
    if(publicacionesFiltradas.length > 0){
      html += publicacionesFiltradas.map(pub => `
        <tr>
          <td class="pub-titulo">${pub.titulo || '—'}</td>
          <td class="pub-fecha">${pub.fecha || '—'}</td>
          <td><span class="pub-tipo">${pub.tipo || 'Publicación'}</span></td>
          <td>
            ${pub.enlace ? `<a href="${pub.enlace}" target="_blank" class="pub-enlace">Ver ↗</a>` : '—'}
          </td>
        </tr>
      `).join('');
    }
    
    tbody.innerHTML = html;
    
    // Agregar event listeners a los botones de descarga
    document.querySelectorAll('.btn-descargar-pdf').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const url = decodeURIComponent(btn.dataset.url);
        const nombre = btn.dataset.nombre;
        
        btn.disabled = true;
        btn.innerHTML = '⏳ Descargando...';
        
        try {
          const proxyUrl = `/api/documento?url=${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          
          if(!response.ok){
            throw new Error(`Error ${response.status}`);
          }
          
          const blob = await response.blob();
          
          // Crear link de descarga
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = nombre;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(downloadUrl);
          
          btn.innerHTML = '✅ Descargado';
          setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = '⬇️ Descargar';
          }, 2000);
          
        } catch(err){
          console.error('[Descarga] Error:', err);
          btn.innerHTML = '❌ Error';
          setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = '⬇️ Descargar';
          }, 2000);
        }
      });
    });
    
    showPublicacionesState('results');
  }
  
  // Función para consultar publicaciones via proxy
  async function consultarPublicacionesProxy(codigoDespacho, fechaInicio, fechaFin){
    showPublicacionesState('loading');
    
    const proxyUrl = buildProxyUrl(codigoDespacho, fechaInicio, fechaFin);
    
    try {
      const response = await fetch(proxyUrl, {
        method: 'GET',
        headers: {
          'Accept': 'application/json'
        }
      });
      
      if(!response.ok){
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      const data = await response.json();
      
      if(data.success){
        // Pasar las fechas para filtrar los documentos
        const fechaInicioVal = pubFechaInicio ? pubFechaInicio.value : '';
        const fechaFinVal = pubFechaFin ? pubFechaFin.value : '';
        renderPublicacionesTable(data.publicaciones || [], data.documentos || [], fechaInicioVal, fechaFinVal);
        console.log('[Publicaciones] Recibidas:', data.total, 'publicaciones,', data.totalDocumentos || 0, 'documentos');
        if(data.html_preview){
          console.log('[Publicaciones] Preview HTML:', data.html_preview);
        }
      } else {
        console.error('[Publicaciones] Error del servidor:', data.error);
        showPublicacionesState('error');
      }
      
    } catch(err){
      console.error('[Publicaciones] Error de conexión:', err.message);
      // Probablemente el proxy no está corriendo
      showPublicacionesState('error');
    }
  }

      try {
        const proxyUrl = `/api/documento?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        
        if(!response.ok) throw new Error(`Error ${response.status}`);
        
        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = nombre;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(downloadUrl);
        
        btn.innerHTML = '✅ Listo';
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '⬇️ Descargar';
        }, 2000);
      } catch(err){
