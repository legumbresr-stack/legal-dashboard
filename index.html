  const btnAddClienteProceso = document.getElementById('btnAddClienteProceso');
  
  // Open modal to add cliente
  if(btnAddClienteProceso){
    btnAddClienteProceso.addEventListener('click', () => {
      editingClienteProcesoId = null;
      document.getElementById('clienteProcesoModalTitle').textContent = 'Agregar cliente';
      document.getElementById('clienteProcesoNombre').value = '';
      document.getElementById('clienteProcesoCedula').value = '';
      document.getElementById('clienteProcesoCelular').value = '';
      document.getElementById('clienteProcesoCorreo').value = '';
      document.getElementById('btnDeleteClienteProceso').style.display = 'none';
      clienteProcesoModalOverlay.classList.add('open');
    });
  }
  
  // Edit cliente
  document.querySelectorAll('.edit-cliente-proceso').forEach(btn => {
    btn.addEventListener('click', () => {
      const clId = btn.dataset.id;
      const proceso = procesos.find(p => p.id === selectedProcessId);
      if(proceso && proceso.clientesProceso){
        const cl = proceso.clientesProceso.find(c => c.id === clId);
        if(cl){
          editingClienteProcesoId = clId;
          document.getElementById('clienteProcesoModalTitle').textContent = 'Editar cliente';
          document.getElementById('clienteProcesoNombre').value = cl.nombre || '';
          document.getElementById('clienteProcesoCedula').value = cl.cedula || '';
          document.getElementById('clienteProcesoCelular').value = cl.celular || '';
          document.getElementById('clienteProcesoCorreo').value = cl.correo || '';
          document.getElementById('btnDeleteClienteProceso').style.display = 'block';
          clienteProcesoModalOverlay.classList.add('open');
        }
      }
    });
  });
  
  // Delete cliente from card
  document.querySelectorAll('.delete-cliente-proceso').forEach(btn => {
    btn.addEventListener('click', () => {
      const clId = btn.dataset.id;
      if(confirm('¿Eliminar este cliente?')){
        const proceso = procesos.find(p => p.id === selectedProcessId);
        if(proceso && proceso.clientesProceso){
          proceso.clientesProceso = proceso.clientesProceso.filter(c => c.id !== clId);
          saveProcesos();
          render();
        }
      }
    });
  });
  
  // Cancel cliente modal
  const btnCancelClienteProceso = document.getElementById('btnCancelClienteProceso');
  if(btnCancelClienteProceso){
    btnCancelClienteProceso.addEventListener('click', () => {
      clienteProcesoModalOverlay.classList.remove('open');
    });
  }
  
  // Close on overlay click
  if(clienteProcesoModalOverlay){
    clienteProcesoModalOverlay.addEventListener('click', (e) => {
      if(e.target === clienteProcesoModalOverlay) clienteProcesoModalOverlay.classList.remove('open');
    });
  }
  
  // Save cliente
  const btnSaveClienteProceso = document.getElementById('btnSaveClienteProceso');
  if(btnSaveClienteProceso){
    btnSaveClienteProceso.addEventListener('click', () => {
      const nombre = document.getElementById('clienteProcesoNombre').value.trim();
      if(!nombre){
        alert('El nombre es requerido');
        return;
      }
      
      const proceso = procesos.find(p => p.id === selectedProcessId);
      if(proceso){
        if(!proceso.clientesProceso) proceso.clientesProceso = [];
        
        const data = {
          nombre,
          cedula: document.getElementById('clienteProcesoCedula').value.trim(),
          celular: document.getElementById('clienteProcesoCelular').value.trim(),
          correo: document.getElementById('clienteProcesoCorreo').value.trim()
        };
        
        if(editingClienteProcesoId){
          const idx = proceso.clientesProceso.findIndex(c => c.id === editingClienteProcesoId);
          if(idx !== -1){
            proceso.clientesProceso[idx] = { ...proceso.clientesProceso[idx], ...data };
          }
        } else {
          proceso.clientesProceso.push({
            id: 'cl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            ...data
          });
        }
        
        saveProcesos();
        clienteProcesoModalOverlay.classList.remove('open');
        render();
      }
    });
  }
  
  // Delete cliente from modal
  const btnDeleteClienteProceso = document.getElementById('btnDeleteClienteProceso');
  if(btnDeleteClienteProceso){
    btnDeleteClienteProceso.addEventListener('click', () => {
      if(editingClienteProcesoId && confirm('¿Eliminar este cliente?')){
        const proceso = procesos.find(p => p.id === selectedProcessId);
        if(proceso && proceso.clientesProceso){
          proceso.clientesProceso = proceso.clientesProceso.filter(c => c.id !== editingClienteProcesoId);
          saveProcesos();
          clienteProcesoModalOverlay.classList.remove('open');
          render();
        }
      }
    });
  }

  // Setup dynamic table functionality
  setupDynamicTable();
}

// Dynamic table functionality
function setupDynamicTable(){
  const table = document.getElementById('processTable');
  if(!table) return;
  
  // Tab switching (Activos / Archivados)
  document.querySelectorAll('.tab-btn[data-tab]').forEach(tab => {
    tab.addEventListener('click', () => {
      processFilter = tab.dataset.tab;
      render();
    });
  });
  
  // Column visibility toggle
  const btnColumnas = document.getElementById('btnColumnas');
  const columnPanel = document.getElementById('columnPanel');
  
  if(btnColumnas && columnPanel){
    btnColumnas.addEventListener('click', (e) => {
      e.stopPropagation();
      columnPanel.classList.toggle('open');
    });
    
    document.addEventListener('click', (e) => {
      if(!columnPanel.contains(e.target) && e.target !== btnColumnas){
        columnPanel.classList.remove('open');
      }
    });
    
    // Column checkboxes
    columnPanel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const col = cb.dataset.col;
        const show = cb.checked;
        
        // Toggle visibility of column
        table.querySelectorAll(`th[data-col="${col}"], td[data-col="${col}"]`).forEach(cell => {
          cell.style.display = show ? '' : 'none';
        });
      });
    });
  }
  
  // Search functionality
  const searchInput = document.getElementById('searchProcess');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const rows = table.querySelectorAll('tbody tr');
      let visibleCount = 0;
      
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        const match = text.includes(query);
        row.style.display = match ? '' : 'none';
        if(match) visibleCount++;
      });
      
      const resultsCount = document.getElementById('resultsCount');
      if(resultsCount){
        resultsCount.textContent = `${visibleCount} procesos`;
      }
    });
  }
  
  // Sortable columns
  let currentSort = { col: null, dir: 'asc' };
  
  table.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const sortKey = th.dataset.sort;
      if(!sortKey) return;
      
      // Toggle direction
      if(currentSort.col === sortKey){
        currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.col = sortKey;
        currentSort.dir = 'asc';
      }
      
      // Update UI
      table.querySelectorAll('th.sortable').forEach(h => {
        h.classList.remove('sort-asc', 'sort-desc');
      });
      th.classList.add(currentSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
      
      // Sort the data
      procesos.sort((a, b) => {
        let valA = a[sortKey] || '';
        let valB = b[sortKey] || '';
        
        if(typeof valA === 'string') valA = valA.toLowerCase();
        if(typeof valB === 'string') valB = valB.toLowerCase();
        
        if(valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
        if(valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
        return 0;
      });
      
      saveProcesos();
      render();
    });
  });
  
  // Column resize - targets colgroup for persistence
  const colgroup = table.querySelector('colgroup');
  const cols = colgroup ? Array.from(colgroup.querySelectorAll('col')) : [];
  const allHeaders = Array.from(table.querySelectorAll('thead th'));
  
  // Setup resizers
  const tableContainer = table.closest('.process-table-container');
  
  table.querySelectorAll('th .resizer').forEach(resizer => {
    const th = resizer.parentElement;
    const thIndex = allHeaders.indexOf(th);
    const col = cols[thIndex];
    
    let startX, startWidth, scrollLeft;
    
    resizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      startX = e.clientX;
      startWidth = th.offsetWidth;
      scrollLeft = tableContainer ? tableContainer.scrollLeft : 0;
      resizer.classList.add('active');
      
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      
      const onMouseMove = (ev) => {
        ev.preventDefault();
        // Mantener la posición del scroll
        if(tableContainer) {
          tableContainer.scrollLeft = scrollLeft;
        }
        const newWidth = Math.max(50, startWidth + (ev.clientX - startX));
        if(col) {
          col.style.width = newWidth + 'px';
        }
      };
      
      const onMouseUp = (ev) => {
        ev.preventDefault();
        resizer.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        
        // Save widths to localStorage
        const widths = {};
        cols.forEach(c => {
          if(c.dataset.col) {
            widths[c.dataset.col] = parseInt(c.style.width) || 150;
          }
        });
        localStorage.setItem('columnWidths', JSON.stringify(widths));
      };
      
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  });
  
  // Column drag to reorder
  let draggedTh = null;
  const headers = table.querySelectorAll('th[data-col]');
  
  headers.forEach(th => {
    th.setAttribute('draggable', 'true');
    
    th.addEventListener('dragstart', function(e) {
      draggedTh = this;
      this.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    
    th.addEventListener('dragend', function() {
      this.style.opacity = '1';
      headers.forEach(h => h.classList.remove('drag-over'));
      draggedTh = null;
    });
    
    th.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    
    th.addEventListener('dragenter', function() {
      if(this !== draggedTh && draggedTh) {
        this.classList.add('drag-over');
      }
    });
    
    th.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });
    
    th.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      
      if(!draggedTh || draggedTh === this) return;
      
      const allTh = Array.from(table.querySelectorAll('thead th'));
      const fromIndex = allTh.indexOf(draggedTh);
      const toIndex = allTh.indexOf(this);
      
      // Move header
      if(fromIndex < toIndex) {
        this.after(draggedTh);
      } else {
        this.before(draggedTh);
      }
      
      // Move all cells in body rows
      table.querySelectorAll('tbody tr').forEach(row => {
        const cells = Array.from(row.children);
        const fromCell = cells[fromIndex];
        const toCell = cells[toIndex];
        
        if(fromCell && toCell) {
          if(fromIndex < toIndex) {
            toCell.after(fromCell);
          } else {
            toCell.before(fromCell);
          }
        }
      });
    });
  });
  
  // Selection functionality
  const selectionBar = document.getElementById('selectionBar');
  const selectionCount = document.getElementById('selectionCount');
  const selectAllCheckbox = document.getElementById('selectAllProcesses');
  const rowCheckboxes = table.querySelectorAll('tbody input.row-checkbox');
  
  function updateSelectionBar(){
    const checked = table.querySelectorAll('tbody input.row-checkbox:checked');
    const count = checked.length;
    
    if(count > 0){
      selectionBar.classList.add('visible');
      selectionCount.textContent = count === 1 ? '1 proceso seleccionado' : `${count} procesos seleccionados`;
    } else {
      selectionBar.classList.remove('visible');
    }
    
    // Update select all checkbox state
    if(selectAllCheckbox){
      const total = table.querySelectorAll('tbody input.row-checkbox').length;
      selectAllCheckbox.checked = count === total && total > 0;
      selectAllCheckbox.indeterminate = count > 0 && count < total;
    }
  }
  
  // Select all checkbox
  if(selectAllCheckbox){
    selectAllCheckbox.addEventListener('change', () => {
      const isChecked = selectAllCheckbox.checked;
      table.querySelectorAll('tbody input.row-checkbox').forEach(cb => {
        cb.checked = isChecked;
        cb.closest('tr').classList.toggle('selected', isChecked);
      });
      updateSelectionBar();
    });
  }
  
  // Individual row checkboxes
  rowCheckboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('tr').classList.toggle('selected', cb.checked);
      updateSelectionBar();
    });
  });
  
  // Archive button
  const btnArchivar = document.getElementById('btnArchivarSeleccion');
  if(btnArchivar){
    btnArchivar.addEventListener('click', () => {
      const checkedIds = Array.from(table.querySelectorAll('tbody input.row-checkbox:checked'))
        .map(cb => cb.dataset.id);
      
      if(checkedIds.length === 0) return;
      
      checkedIds.forEach(id => {
        const proceso = procesos.find(p => p.id === id);
        if(proceso){
          proceso.estado = 'Finalizado';
        }
      });
      
      saveProcesos();
      render();
    });
  }
  
  // Unarchive button
  const btnDesarchivar = document.getElementById('btnDesarchivarSeleccion');
  if(btnDesarchivar){
    btnDesarchivar.addEventListener('click', () => {
      const checkedIds = Array.from(table.querySelectorAll('tbody input.row-checkbox:checked'))
        .map(cb => cb.dataset.id);
      
      if(checkedIds.length === 0) return;
      
      checkedIds.forEach(id => {
        const proceso = procesos.find(p => p.id === id);
        if(proceso){
          proceso.estado = 'Activo';
        }
      });
      
      saveProcesos();
      render();
    });
  }
  
  // Delete button
  const btnEliminar = document.getElementById('btnEliminarSeleccion');
  if(btnEliminar){
    btnEliminar.addEventListener('click', () => {
      const checkedIds = Array.from(table.querySelectorAll('tbody input.row-checkbox:checked'))
        .map(cb => cb.dataset.id);
      
      if(checkedIds.length === 0) return;
      
      const confirmMsg = checkedIds.length === 1 
        ? '¿Estás seguro de eliminar este proceso?' 
        : `¿Estás seguro de eliminar ${checkedIds.length} procesos?`;
      
      if(confirm(confirmMsg)){
        procesos = procesos.filter(p => !checkedIds.includes(p.id));
        saveProcesos();
        render();
      }
    });
  }
  
  // Estado dropdown functionality
  const btnEstado = document.getElementById('btnEstado');
  const estadoMenu = document.getElementById('estadoMenu');
  
  if(btnEstado && estadoMenu){
    // Toggle menu on button click
    btnEstado.addEventListener('click', (e) => {
      e.stopPropagation();
      estadoMenu.classList.toggle('open');
    });
    
    // Handle estado option selection
    estadoMenu.querySelectorAll('.estado-option').forEach(option => {
      option.addEventListener('click', (e) => {
        e.stopPropagation();
        const estado = option.dataset.estado;
        const checkedIds = Array.from(table.querySelectorAll('tbody input.row-checkbox:checked'))
          .map(cb => cb.dataset.id);
        
        if(checkedIds.length === 0) return;
        
        // Update estadoColor for selected processes
        checkedIds.forEach(id => {
          const proceso = procesos.find(p => p.id === id);
          if(proceso){
            proceso.estadoColor = (estado === 'ninguno') ? null : estado;
          }
        });
        
        // Close menu and save
        estadoMenu.classList.remove('open');
        saveProcesos();
        render();
      });
    });
    
    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if(!estadoMenu.contains(e.target) && e.target !== btnEstado){
        estadoMenu.classList.remove('open');
      }
    });
  }
}

function openProcesoModal(id){
  editingId = id || null;
  modalType = 'proceso';
  const p = id ? procesos.find(x=>x.id===id) : {};
  document.getElementById('modalTitle').textContent = id ? 'Editar proceso' : 'Nuevo proceso';
  document.getElementById('modalBody').innerHTML = '<div class="field"><label>Nombre / asunto</label><input id="f_nombre" value="'+(p.nombre||'')+'" placeholder="Ej: Declaración de renta 2025"></div><div class="field"><label>Radicado / referencia</label><input id="f_radicado" value="'+(p.radicado||'')+'" placeholder="Opcional"></div><div class="field"><label>Cliente</label><select id="f_cliente"><option value="">Sin asignar</option>'+clientes.map(c=>'<option value="'+c.id+'" '+(p.clienteId===c.id?'selected':'')+'>'+c.nombre+'</option>').join('')+'</select></div><div class="field"><label>Tipo</label><select id="f_tipo">'+TIPOS.map(t=>'<option '+(p.tipo===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field"><label>Estado</label><select id="f_estado">'+ESTADOS.map(t=>'<option '+(p.estado===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field"><label>Fecha de inicio</label><input type="date" id="f_inicio" value="'+(p.fechaInicio||'')+'"></div><div class="field"><label>Fecha última actuación</label><input type="date" id="f_actuacion" value="'+(p.fechaUltimaActuacion||'')+'"></div><div class="field"><label>Notas</label><textarea id="f_notas">'+(p.notas||'')+'</textarea></div>';
  document.getElementById('overlay').classList.add('open');
}

function saveProcesoModal(){
  const nombre = document.getElementById('f_nombre').value.trim();
  if(!nombre){ alert('Ponle un nombre al proceso.'); return; }
  const data = {
    id: editingId || uid(),
    nombre,
    radicado: document.getElementById('f_radicado').value.trim(),
    clienteId: document.getElementById('f_cliente').value,
    tipo: document.getElementById('f_tipo').value,
    estado: document.getElementById('f_estado').value,
    fechaInicio: document.getElementById('f_inicio').value,
    fechaUltimaActuacion: document.getElementById('f_actuacion').value,
    notas: document.getElementById('f_notas').value.trim(),
  };
  if(editingId){ procesos = procesos.map(p=> p.id===editingId ? data : p); }
  else { procesos.push(data); }
  saveProcesos();
  closeModal();
  render();
}

function saveClienteModal(){
  const nombre = document.getElementById('c_nombre').value.trim();
  if(!nombre){ alert('Ponle un nombre al cliente.'); return; }
  const existingClient = editingId ? clientes.find(c=>c.id===editingId) : null;
  const data = {
    id: editingId || uid(),
    nombre,
    tipo: document.getElementById('c_tipo').value,
    documento: document.getElementById('c_documento').value.trim(),
    telefono: document.getElementById('c_telefono').value.trim(),
    correo: document.getElementById('c_correo').value.trim(),
    notas: document.getElementById('c_notas').value.trim(),
    createdAt: existingClient?.createdAt || new Date().toISOString()
  };
  if(editingId){ clientes = clientes.map(c=> c.id===editingId ? {...c, ...data} : c); }
  else { clientes.push(data); }
  saveClientes();
  closeModal();
  render();
}

function openEventoModal(id){
  editingId = id || null;
  modalType = 'evento';
  const e = id ? eventos.find(x=>x.id===id) : {};
  document.getElementById('modalTitle').textContent = id ? 'Editar recordatorio' : 'Nuevo recordatorio';
  let html = '<div class="field"><label>Título</label><input id="e_titulo" value="'+(e.titulo||'')+'" placeholder="Ej: Entregar exógena"></div><div class="field"><label>Fecha</label><input type="date" id="e_fecha" value="'+(e.fecha||'')+'"></div><div class="field"><label>Proceso relacionado</label><select id="e_proceso"><option value="">Ninguno</option>'+procesos.map(p=>'<option value="'+p.id+'" '+(e.procesoId===p.id?'selected':'')+'>'+p.nombre+'</option>').join('')+'</select></div><div class="field"><label>Notas</label><textarea id="e_notas">'+(e.notas||'')+'</textarea></div>';
  if(id) html += '<button class="btn" style="color:var(--red-text);border-color:var(--red-bg);width:100%;margin-top:4px;" id="e_delete">Eliminar recordatorio</button>';
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  if(id){
    document.getElementById('e_delete').addEventListener('click', ()=>{
      eventos = eventos.filter(x=>x.id!==id);
      saveEventos();
      closeModal(); render();
    });
  }
}

function saveEventoModal(){
  const titulo = document.getElementById('e_titulo').value.trim();
  const fecha = document.getElementById('e_fecha').value;
  if(!titulo || !fecha){ alert('Ponle título y fecha al recordatorio.'); return; }
  const data = {
    id: editingId || uid(),
    titulo,
    fecha,
    procesoId: document.getElementById('e_proceso').value,
    notas: document.getElementById('e_notas').value.trim(),
  };
  if(editingId){ eventos = eventos.map(e=> e.id===editingId ? data : e); }
  else { eventos.push(data); }
  saveEventos();
  closeModal();
  render();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  editingId = null; modalType = null;
}

document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('modalSave').addEventListener('click', ()=>{
  if(modalType==='proceso') saveProcesoModal();
  else if(modalType==='cliente') saveClienteModal();
  else if(modalType==='evento') saveEventoModal();
});

loadData();
</script>
